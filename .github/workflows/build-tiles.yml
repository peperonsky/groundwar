# Rebuilds the pre-built map data once a week and commits it only if
# something changed:
#   data/incidents/  battles, operations, events
#   data/figures/    notable people
#   data/places/     place-search autocomplete
#   places/          static "history near <town>" pages, plus sitemap.xml and
#                    _redirects for any page whose address changed
#                    (built from the data above, so it runs last)
# Both from QLever's copy of Wikidata (see README, "Where the data comes from").
# Both builds are deterministic, so a week with no relevant edits produces
# no commit. Each build only replaces its files after all of its queries
# succeed, so if one fails, the other's update still gets committed and
# the failed one keeps last week's data.
#
# Also runnable by hand: Actions tab -> "Build map data" -> Run workflow.
# Pushing to main triggers the normal GitHub Pages deploy, same as any commit.
name: Build map data

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-tiles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build battle and event tiles
        id: incidents
        continue-on-error: true
        run: node scripts/build-tiles.mjs

      - name: Build people tiles
        id: figures
        continue-on-error: true
        run: node scripts/build-figure-tiles.mjs

      - name: Build place-search list
        id: places
        continue-on-error: true
        run: node scripts/build-places.mjs

      - name: Build place pages
        id: placepages
        continue-on-error: true
        run: node scripts/build-place-pages.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- data places sitemap.xml _redirects)" ]; then
            echo "Map data unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data places sitemap.xml _redirects
            git commit -m "Rebuild map data from Wikidata"
            git push
          fi

      # Surface a failed build as a failed run (so it gets noticed), but
      # only after whatever did succeed has been committed above.
      - name: Fail if a build failed
        if: steps.incidents.outcome == 'failure' || steps.figures.outcome == 'failure' || steps.places.outcome == 'failure' || steps.placepages.outcome == 'failure'
        run: |
          echo "battles/events build: ${{ steps.incidents.outcome }}"
          echo "people build: ${{ steps.figures.outcome }}"
          echo "places build: ${{ steps.places.outcome }}"
          echo "place pages build: ${{ steps.placepages.outcome }}"
          exit 1
