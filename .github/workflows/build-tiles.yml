# Rebuilds the pre-built battles / operations / events tiles in
# data/incidents/ from Wikidata once a week, and commits them only if
# something changed. The output is deterministic, so a week with no
# relevant Wikidata edits produces no commit at all.
#
# Also runnable by hand: Actions tab -> "Build incident tiles" -> Run workflow.
# Pushing to main triggers the normal GitHub Pages deploy, same as any commit.
name: Build incident tiles

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-tiles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build tiles
        run: node scripts/build-tiles.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/incidents && [ -z "$(git ls-files --others --exclude-standard data/incidents)" ]; then
            echo "Tiles unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/incidents
          git commit -m "Rebuild incident tiles from Wikidata"
          git push
